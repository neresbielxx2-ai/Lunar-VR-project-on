name: Build AGUS VR

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile & package APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download hand tracking model
        run: ./gradlew --no-daemon downloadHandModel --stacktrace

      - name: Build debug + release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk     artifacts/AgusVR-debug.apk
          cp app/build/outputs/apk/release/app-release.apk  artifacts/AgusVR-release-signed.apk
          ls -lh artifacts/

      - name: Verify APK signatures
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $ANDROID_HOME/build-tools; skipping signature verification"
            exit 0
          fi
          echo "using $APKSIGNER"
          "$APKSIGNER" verify --print-certs artifacts/AgusVR-release-signed.apk
          "$APKSIGNER" verify --print-certs artifacts/AgusVR-debug.apk

      - name: APK summary
        run: |
          {
            echo "## APK summary"
            for f in artifacts/*.apk; do
              echo ""
              echo "### $(basename "$f")"
              echo "- size: $(stat -c%s "$f") bytes"
              echo "- sha256: \`$(sha256sum "$f" | cut -d' ' -f1)\`"
              LIST="$(unzip -l "$f" | awk 'NR>3 {print $4}' | grep -v '^$' | grep -v '^----' || true)"
              echo "- dex files: $(echo "$LIST" | grep -c '\.dex$' || true)"
              echo "- native ABIs: $(echo "$LIST" | grep '^lib/' | cut -d/ -f2 | sort -u | tr '\n' ' ')"
              echo "- native .so count: $(echo "$LIST" | grep -c '^lib/.*\.so$' || true)"
              echo "- hand tracking model: $(echo "$LIST" | grep -c 'hand_landmarker\.task' || true) (expected 1)"
              echo "- bundled games/assets: $(echo "$LIST" | grep -c '^assets/' || true) entries"
              echo "- signature files: $(echo "$LIST" | grep -c '^META-INF/.*\.\(RSA\|DSA\|EC\|SF\|MF\)$' || true)"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AgusVR-APKs
          path: artifacts/
          retention-days: 30
