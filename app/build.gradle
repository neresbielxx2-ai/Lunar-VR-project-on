plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Downloads the MediaPipe hand-landmarker model into assets before building.
apply from: "$rootDir/tools/download_model.gradle"

android {
    namespace 'com.agusvr'
    compileSdk 35

    defaultConfig {
        applicationId "com.agusvr"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resourceConfigurations += ["en", "pt"]
    }

    signingConfigs {
        release {
            storeFile rootProject.file(providers.gradleProperty('AGUS_KEYSTORE_FILE').getOrElse('keystore/agusvr-release.p12'))
            storePassword providers.gradleProperty('AGUS_KEYSTORE_PASSWORD').getOrElse('agusvr2026')
            keyAlias providers.gradleProperty('AGUS_KEY_ALIAS').getOrElse('agusvr')
            keyPassword providers.gradleProperty('AGUS_KEY_PASSWORD').getOrElse('agusvr2026')
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
            versionNameSuffix "-dev"
            crunchPngs false
        }
        release {
            // R8 is intentionally disabled for the demo build: Filament and
            // MediaPipe ship large native/JNI surfaces that are safest to keep
            // un-obfuscated until a device test matrix is available.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
        warningsAsErrors false
    }
    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                'META-INF/*.kotlin_module', 'DebugProbesKt.bin', 'kotlin/**'
            ]
        }
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    // --- Core / UI -----------------------------------------------------------
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.7'

    // --- Coroutines ----------------------------------------------------------
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // --- AgusCamera: CameraX passthrough (rear camera) -----------------------
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // --- AgusHandTracking: MediaPipe Hand Landmarker (real hand tracking) ----
    implementation 'com.google.mediapipe:tasks-vision:0.10.32'

    // --- AgusModelLab: Filament 3D engine (GLB/glTF + procedural OBJ) --------
    def filament = '1.75.1'
    implementation "com.google.android.filament:filament-android:$filament"
    implementation "com.google.android.filament:gltfio-android:$filament"
    implementation "com.google.android.filament:filament-utils-android:$filament"
    implementation "com.google.android.filament:filamat-android:$filament"
}
