<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Astro Pong — Agus VR</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#04060C;overflow:hidden;touch-action:none;
    font-family:'Segoe UI',Roboto,sans-serif;-webkit-user-select:none;user-select:none}
  #c{display:block;width:100vw;height:100vh}
  #msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#F2F7FF;text-align:center;pointer-events:none;text-shadow:0 0 18px rgba(157,107,255,.6)}
  #msg h1{font-size:34px;margin:0 0 6px;letter-spacing:8px;color:#9D6BFF}
  #msg p{margin:4px;color:#A9B8D8;font-size:13px;letter-spacing:1px}
  .hide{opacity:0;transition:opacity .3s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg"><h1>ASTRO PONG</h1><p>arraste para mover · primeiro a 7 vence</p><p style="color:#9D6BFF">TOQUE PARA INICIAR</p></div>
<script>
(function(){
"use strict";
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),msg=document.getElementById('msg');
var W=0,H=0,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=window.innerWidth;H=window.innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();
var PW=14,PH=90,state=0,py=0,ay=0,bx=0,by=0,vx=0,vy=0,ps=0,as=0,trail=[],t=0;
function center(){bx=W/2;by=H/2;var a=(Math.random()*.8-.4)+(Math.random()<.5?Math.PI:0);vx=Math.cos(a)*6;vy=Math.sin(a)*6;trail=[];}
function reset(){ps=0;as=0;py=H/2-PH/2;ay=H/2-PH/2;center();}
function start(){reset();state=1;msg.classList.add('hide');}
function end(win){state=2;msg.innerHTML='<h1>'+(win?'VITÓRIA':'DERROTA')+'</h1><p>'+ps+' × '+as+'</p><p style="color:#9D6BFF">TOQUE PARA REINICIAR</p>';msg.classList.remove('hide');}
function clampPaddle(){py=Math.max(10,Math.min(H-PH-10,py));ay=Math.max(10,Math.min(H-PH-10,ay));}
function loop(){
  t++;ctx.fillStyle='rgba(4,6,12,.4)';ctx.fillRect(0,0,W,H);
  // center line
  ctx.strokeStyle='rgba(157,107,255,.15)';ctx.setLineDash([6,14]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
  if(state===1){
    // ai
    var target=by-PH/2;ay+=(target-ay)*0.055;clampPaddle();
    bx+=vx;by+=vy;
    trail.push({x:bx,y:by});if(trail.length>14)trail.shift();
    if(by<8||by>H-8){vy=-vy;}
    if(bx<28+PW&&bx>16&&by>py&&by<py+PH){vx=Math.abs(vx)*1.045;vy+=(by-(py+PH/2))*.14;}
    if(bx>W-28-PW&&bx<W-16&&by>ay&&by<ay+PH){vx=-Math.abs(vx)*1.045;vy+=(by-(ay+PH/2))*.14;}
    vx=Math.max(-16,Math.min(16,vx));vy=Math.max(-12,Math.min(12,vy));
    if(bx<0){as++;if(as>=7)return end(false);center();}
    if(bx>W){ps++;if(ps>=7)return end(true);center();}
  }
  // trail
  for(var i=0;i<trail.length;i++){var p=trail[i],a=i/trail.length;
    ctx.fillStyle='rgba(77,232,255,'+(a*.35)+')';ctx.beginPath();ctx.arc(p.x,p.y,5*a+1,0,7);ctx.fill();}
  // paddles
  ctx.shadowBlur=16;
  ctx.shadowColor='#4DE8FF';ctx.fillStyle='#4DE8FF';roundRect(20,py,PW,PH);
  ctx.shadowColor='#9D6BFF';ctx.fillStyle='#9D6BFF';roundRect(W-20-PW,ay,PW,PH);
  // ball
  ctx.shadowColor='#FFFFFF';ctx.fillStyle='#F2F7FF';ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill();ctx.shadowBlur=0;
  // score
  ctx.fillStyle='rgba(169,184,216,.8)';ctx.font='600 26px sans-serif';ctx.textAlign='center';
  ctx.fillText(ps,W/2-52,44);ctx.fillText(as,W/2+52,44);
  requestAnimationFrame(loop);
}
function roundRect(x,y,w,h){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,7):ctx.rect(x,y,w,h);ctx.fill();}
function inputY(y){if(state!==1){start();return;}py=y-PH/2;clampPaddle();}
cv.addEventListener('touchstart',function(e){e.preventDefault();inputY(e.touches[0].clientY);},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();inputY(e.touches[0].clientY);},{passive:false});
cv.addEventListener('mousemove',function(e){inputY(e.clientY);});
window.addEventListener('keydown',function(e){if(state!==1){start();return;}
  if(e.key==='ArrowUp'){py-=36;clampPaddle();}if(e.key==='ArrowDown'){py+=36;clampPaddle();}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state===1)state=3;});
loop();
})();
</script>
</body>
</html>
